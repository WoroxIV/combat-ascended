plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

apply from: rootProject.file('gradle/publish.gradle')

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = rootProject.file("run/${name}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
            // Sources des traductions lues par ModLanguageProvider (un fichier par langue).
            systemProperty 'combatascended.langSources', rootProject.file('common/src/main/lang').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

ext.gameTestAnnotations = '@net.neoforged.neoforge.gametest.GameTestHolder(CombatAscended.MODID)\n@net.neoforged.neoforge.gametest.PrefixGameTestTemplate(false)'
ext.gameTestArena = 'empty'

dependencies {
    // JEI et EMI restent optionnels pour les joueurs. Pour tester avec l'un des deux : gradlew :neoforge:runClient -Pbw_compat=jei (ou emi).
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    if (project.findProperty('bw_compat') == 'jei') runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    if (project.findProperty('bw_compat') == 'emi') runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

// Les tests tournent avec les vraies armes de Better Weaponry : rien de ce mod ne part dans le jar publié.
def betterWeaponryJar = rootProject.file('../../Better Weaponry/BetterWeaponry-1.21.1/neoforge/build/libs/better_weaponry-3.1.2+1.21.1-neoforge.jar')
dependencies {
    if (betterWeaponryJar.exists()) compileOnly files(betterWeaponryJar)
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        copy { from betterWeaponryJar; into rootProject.file('run/gameTestServer/mods') }
        copy { from rootProject.file('tools/parity/reference-1.21.1.json'); into rootProject.file('run/gameTestServer'); rename { 'parity-reference.json' } }
    }
}
