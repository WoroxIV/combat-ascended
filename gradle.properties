# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Parchment : noms de paramètres lisibles dans le code du jeu (https://parchmentmc.org/docs/getting-started)
parchment_minecraft=1.20.1
parchment_version=2023.09.03
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.20.1
java_version=17
mixinextras_version=0.5.0
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.4.29
forge_version_range=[47,)
loader_version_range=[47,)

## Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1
modmenu_version=7.2.2
# Seulement pour tester JEI en développement (-Pbw_compat=jei) : le mod lui-même accepte fabric_loader_version.
jei_fabric_loader_version=0.19.4
mezz_config_version=0.6.10

## Optional integrations (compile only)
jei_version=15.74.0.234
emi_version=1.1.24+1.20.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=combat_reforged
mod_name=Combat Reforged
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.combatreforged
mod_authors=WoroxIV
mod_display_url=https://modrinth.com/mod/combat-reforged-mod
mod_issue_tracker_url=https://github.com/WoroxIV/combat-reforged/issues
# Pages du mod sur les sites de publication (voir gradle/publish.gradle).
modrinth_project_id=
curseforge_project_id=
mod_description=A combat system for any weapon mod: combos, parries, dashes, dual wielding, two-handed weapons, unique attacks for dozens of weapon archetypes, an in-game editor and animated tutorials.
